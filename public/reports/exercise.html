<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Exercise Report — VitalSync</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .stat-row{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;}
    .stat-box{flex:1;min-width:120px;background:rgba(212,128,58,0.08);border:1px solid rgba(212,128,58,0.25);border-radius:var(--radius-md);padding:1rem 1.2rem;}
    .stat-val{font-family:'Outfit',sans-serif;font-size:1.6rem;font-weight:800;color:var(--copper-light);}
    .stat-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(200,170,130,0.75);margin-top:4px;}
  </style>
</head>
<body>
<nav id="nav">
  <a href="/dashboard.html" class="nav-brand"><img src="/assets/logo.png" class="nav-logo" alt="VS"><span class="nav-title brand">VitalSync</span></a>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a><a href="/reports/weight.html">Weight</a>
    <a href="/reports/sleep.html">Sleep</a><a href="/reports/stress.html">Stress</a>
    <a href="/reports/meals.html">Meals</a><a href="/reports/goals.html">Goals</a>
  </div>
  <div class="nav-user"><span id="nav-username"></span><button class="btn-nav-logout" id="btn-logout">Logout</button></div>
</nav>
<div id="toast-container"></div>
<div class="page-wrap">
  <div style="margin-bottom:1.8rem">
    <h1 class="page-title">🏋️ Exercise Report</h1>
    <p class="page-subtitle">Calorie burn history, daily workout moods, and per-activity averages.</p>
  </div>

  <div class="stat-row" id="stat-row"></div>

  <div class="glass-card" style="padding:2rem;margin-bottom:1rem">
    <div class="section-label">Daily Calories Burned</div>
    <canvas id="chart" height="80"></canvas>
  </div>

  <div class="glass-card" style="padding:2rem;margin-bottom:1rem">
    <div class="section-label">Daily Mood & Burn</div>
    <div id="mood-table"></div>
  </div>

  <div class="glass-card" style="padding:2rem;margin-bottom:1rem">
    <div class="section-label">Averages per Activity Type</div>
    <div id="type-table"></div>
  </div>

  <div class="glass-card" style="padding:2rem">
    <div class="section-label">All Sessions</div>
    <div id="sessions-table"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script type="module">
import { guardAuth, initNav, apiFetch, toast } from '/js/api.js';
await guardAuth(); initNav('/reports/exercise.html');
const CO = { ticks:{color:'#9A8A78'}, grid:{color:'rgba(255,200,150,0.05)'} };

try {
  const d = await apiFetch('/api/reports/exercise');
  const { sessions, byDay, byType, stats } = d;

  document.getElementById('stat-row').innerHTML = [
    ['Total Burned',   stats.totalCal.toLocaleString()+' kcal'],
    ['Total Duration', stats.totalMin+' min'],
    ['Active Days',    stats.activeDays+''],
    ['Activity Types', byType.length+''],
  ].map(([l,v])=>`<div class="stat-box"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('');

  new Chart(document.getElementById('chart').getContext('2d'),{
    type:'bar',
    data:{ labels:byDay.map(d=>d.date),
           datasets:[{ label:'Calories Burned', data:byDay.map(d=>d.totalCalories),
             backgroundColor:'rgba(240,160,96,0.75)', borderRadius:4 }] },
    options:{ responsive:true, plugins:{legend:{labels:{color:'#EDE0D0'}}}, scales:{x:CO,y:CO} }
  });

  document.getElementById('mood-table').innerHTML = byDay.length ? `
    <table><thead><tr><th>Date</th><th>Calories</th><th>Duration</th><th>Mood</th></tr></thead>
    <tbody>${byDay.map(r=>`<tr>
      <td>${r.date}</td><td><strong>${r.totalCalories}</strong> kcal</td>
      <td>${r.totalMinutes} min</td><td>${r.mood}</td>
    </tr>`).join('')}</tbody></table>` : '<p style="color:rgba(200,170,130,0.70)">No exercise data yet.</p>';

  document.getElementById('type-table').innerHTML = byType.length ? `
    <table><thead><tr><th>Activity</th><th>Avg Duration</th><th>Avg Calories</th></tr></thead>
    <tbody>${byType.map(r=>`<tr>
      <td style="font-weight:500">${r.type}</td>
      <td>${r.avgMinutes} min</td>
      <td><strong>${r.avgCalories}</strong> kcal</td>
    </tr>`).join('')}</tbody></table>` : '<p style="color:rgba(200,170,130,0.70)">No data.</p>';

  document.getElementById('sessions-table').innerHTML = sessions.length ? `
    <table><thead><tr><th>Date</th><th>Exercise</th><th>Duration</th><th>Calories</th></tr></thead>
    <tbody>${sessions.map(s=>`<tr>
      <td>${s.date}</td><td>${s.exerciseName||'—'}</td>
      <td>${s.durationMinutes||'—'} min</td>
      <td><strong>${s.caloriesBurned||'—'}</strong> kcal</td>
    </tr>`).join('')}</tbody></table>` : '<p style="color:rgba(200,170,130,0.70)">No sessions logged yet.</p>';

} catch(err){ toast(err.message,'error'); }
</script>
</body></html>
