<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Meals Report — VitalSync</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .stat-row{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;}
    .stat-box{flex:1;min-width:120px;background:rgba(90,158,224,0.08);border:1px solid rgba(90,158,224,0.25);border-radius:var(--radius-md);padding:1rem 1.2rem;}
    .stat-val{font-family:'Outfit',sans-serif;font-size:1.6rem;font-weight:800;color:#90BEE8;}
    .stat-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(200,170,130,0.75);margin-top:4px;}
  </style>
</head>
<body>
<nav id="nav">
  <a href="/dashboard.html" class="nav-brand"><img src="/assets/logo.png" class="nav-logo" alt="VS"><span class="nav-title brand">VitalSync</span></a>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a><a href="/reports/weight.html">Weight</a>
    <a href="/reports/sleep.html">Sleep</a><a href="/reports/stress.html">Stress</a>
    <a href="/reports/exercise.html">Exercise</a><a href="/reports/goals.html">Goals</a>
  </div>
  <div class="nav-user"><span id="nav-username"></span><button class="btn-nav-logout" id="btn-logout">Logout</button></div>
</nav>
<div id="toast-container"></div>
<div class="page-wrap">
  <div style="margin-bottom:1.8rem">
    <h1 class="page-title">🍽️ Meals Report</h1>
    <p class="page-subtitle">Calorie trends, meal type breakdown, skipped meals, and food rankings.</p>
  </div>

  <div class="stat-row" id="stat-row"></div>

  <div class="glass-card" style="padding:2rem;margin-bottom:1rem">
    <div class="section-label">Daily Calorie Trend</div>
    <canvas id="chart" height="80"></canvas>
  </div>

  <div class="glass-card" style="padding:2rem;margin-bottom:1rem">
    <div class="section-label">Calories by Meal Type (Daily Pivot)</div>
    <div id="pivot-table"></div>
  </div>

  <div class="glass-card" style="padding:2rem;margin-bottom:1rem">
    <div class="section-label">Skipped Meals</div>
    <div id="skipped-table"></div>
  </div>

  <div class="glass-card" style="padding:2rem">
    <div class="section-label">🏆 Food Calorie Ranking</div>
    <div id="ranking-table"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script type="module">
import { guardAuth, initNav, apiFetch, toast } from '/js/api.js';
await guardAuth(); initNav('/reports/meals.html');
const CO = { ticks:{color:'#9A8A78'}, grid:{color:'rgba(255,200,150,0.05)'} };

try {
  const d = await apiFetch('/api/reports/meals');
  const { byDay, skipped, foodRanking, stats } = d;

  document.getElementById('stat-row').innerHTML = [
    ['Total Eaten',   stats.totalEaten.toLocaleString()+' kcal'],
    ['Daily Average', stats.avgPerDay.toLocaleString()+' kcal'],
    ['Days Logged',   stats.daysLogged+''],
    ['Skipped Meals', skipped.length+''],
  ].map(([l,v])=>`<div class="stat-box"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('');

  new Chart(document.getElementById('chart').getContext('2d'),{
    type:'line',
    data:{ labels:byDay.map(d=>d.date),
           datasets:[{label:'Total Calories',data:byDay.map(d=>d.total),
             borderColor:'#5A9EE0',backgroundColor:'rgba(90,158,224,0.12)',fill:true,tension:0.35,pointRadius:4}]},
    options:{ responsive:true, plugins:{legend:{labels:{color:'#EDE0D0'}}}, scales:{x:CO,y:CO} }
  });

  document.getElementById('pivot-table').innerHTML = byDay.length ? `
    <table><thead><tr><th>Date</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th><th>Snack</th><th>Total</th><th>Tip</th></tr></thead>
    <tbody>${byDay.map(r=>`<tr>
      <td>${r.date}</td><td>${r.breakfast||0}</td><td>${r.lunch||0}</td>
      <td>${r.dinner||0}</td><td>${r.snack||0}</td>
      <td><strong>${r.total}</strong></td><td>${r.tip}</td>
    </tr>`).join('')}</tbody></table>` : '<p style="color:rgba(200,170,130,0.70)">No meals logged yet.</p>';

  document.getElementById('skipped-table').innerHTML = skipped.length ? `
    <table><thead><tr><th>Date</th><th>Skipped Meal</th></tr></thead>
    <tbody>${skipped.map(s=>`<tr>
      <td>${s.date}</td>
      <td style="color:#F8D880">${s.skippedMeal}</td>
    </tr>`).join('')}</tbody></table>` : '<p style="color:#8DEBB8">✅ No skipped meals found.</p>';

  document.getElementById('ranking-table').innerHTML = foodRanking.length ? `
    <table><thead><tr><th>Food</th><th>Calories (logged)</th><th>Calorie Vibe</th></tr></thead>
    <tbody>${foodRanking.map(f=>`<tr>
      <td style="font-weight:500">${f.name}</td>
      <td><strong>${f.calories}</strong> kcal</td>
      <td>${f.vibe}</td>
    </tr>`).join('')}</tbody></table>` : '<p style="color:rgba(200,170,130,0.70)">No food data yet.</p>';

} catch(err){ toast(err.message,'error'); }
</script>
</body></html>
