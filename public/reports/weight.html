<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Weight Report — VitalSync</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .stat-row{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;}
    .stat-box{flex:1;min-width:130px;background:rgba(212,128,58,0.08);border:1px solid rgba(212,128,58,0.25);border-radius:var(--radius-md);padding:1rem 1.2rem;}
    .stat-val{font-family:'Outfit',sans-serif;font-size:1.6rem;font-weight:800;color:var(--copper-light);}
    .stat-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(200,170,130,0.75);margin-top:4px;}
  </style>
</head>
<body>
<nav id="nav">
  <a href="/dashboard.html" class="nav-brand"><img src="/assets/logo.png" class="nav-logo" alt="VS"><span class="nav-title brand">VitalSync</span></a>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a><a href="/reports/sleep.html">Sleep</a>
    <a href="/reports/stress.html">Stress</a><a href="/reports/exercise.html">Exercise</a>
    <a href="/reports/meals.html">Meals</a><a href="/reports/goals.html">Goals</a>
  </div>
  <div class="nav-user"><span id="nav-username"></span><button class="btn-nav-logout" id="btn-logout">Logout</button></div>
</nav>
<div id="toast-container"></div>
<div class="page-wrap">
  <div style="margin-bottom:1.8rem">
    <h1 class="page-title">⚖️ Weight Report</h1>
    <p class="page-subtitle">All-time body weight history, trends, and significant changes.</p>
  </div>

  <div class="stat-row" id="stat-row"></div>

  <div class="glass-card" style="padding:2rem;margin-bottom:1rem">
    <div class="section-label">Weight Trend</div>
    <canvas id="chart" height="80"></canvas>
  </div>

  <div class="glass-card" style="padding:2rem;margin-bottom:1rem">
    <div class="section-label">Significant Drops (&gt; 0.5 kg)</div>
    <div id="drops-table"></div>
  </div>

  <div class="glass-card" style="padding:2rem">
    <div class="section-label">Full History</div>
    <div id="history-table"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script type="module">
import { guardAuth, initNav, apiFetch, toast } from '/js/api.js';
await guardAuth(); initNav('/reports/weight.html');
const CO = { ticks:{color:'#9A8A78'}, grid:{color:'rgba(255,200,150,0.05)' }};

try {
  const d = await apiFetch('/api/reports/weight');
  const { metrics, stats, avg7Day, drops } = d;

  document.getElementById('stat-row').innerHTML = [
    ['Max Weight', stats.maxWeight ? stats.maxWeight.toFixed(1)+' kg' : '—'],
    ['Min Weight', stats.minWeight ? stats.minWeight.toFixed(1)+' kg' : '—'],
    ['7-Day Avg',  avg7Day ? avg7Day+' kg' : '—'],
    ['Logged Entries', metrics.length],
    ['Significant Drops', drops.length],
  ].map(([l,v])=>`<div class="stat-box"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('');

  // Chart
  const sorted = [...metrics].sort((a,b)=>a.recordedAt.localeCompare(b.recordedAt));
  new Chart(document.getElementById('chart').getContext('2d'),{
    type:'line',
    data:{ labels: sorted.map(m=>m.recordedAt?.split('T')[0]||''),
           datasets:[{ label:'Weight (kg)', data:sorted.map(m=>m.weightKg),
             borderColor:'#D4803A', backgroundColor:'rgba(212,128,58,0.1)',
             fill:true, tension:0.35, pointRadius:4 }] },
    options:{ responsive:true, plugins:{legend:{labels:{color:'#EDE0D0'}}},
      scales:{x:CO,y:CO} }
  });

  // Drops table
  document.getElementById('drops-table').innerHTML = drops.length ? `
    <table><thead><tr><th>Date</th><th>Prev Date</th><th>Prev Weight</th><th>Current Weight</th><th>Drop</th></tr></thead>
    <tbody>${drops.map(r=>`<tr>
      <td>${r.date}</td><td>${r.prevDate}</td>
      <td>${r.prevWeight?.toFixed(1)} kg</td><td>${r.currWeight?.toFixed(1)} kg</td>
      <td style="color:#8DEBB8;font-weight:700">▼ ${r.drop} kg</td>
    </tr>`).join('')}</tbody></table>` : '<p style="color:rgba(200,170,130,0.70)">No drops greater than 0.5 kg found.</p>';

  // History
  document.getElementById('history-table').innerHTML = metrics.length ? `
    <table><thead><tr><th>Date</th><th>Weight (kg)</th><th>BMR</th></tr></thead>
    <tbody>${sorted.map(m=>`<tr>
      <td>${m.recordedAt?.split('T')[0]||'—'}</td>
      <td><strong>${m.weightKg?.toFixed(1)||'—'}</strong></td>
      <td style="color:rgba(200,170,130,0.75)">${m.bmr||'—'}</td>
    </tr>`).join('')}</tbody></table>` : '<p style="color:rgba(200,170,130,0.70)">No weight data logged yet.</p>';

} catch(err){ toast(err.message,'error'); }
</script>
</body></html>
