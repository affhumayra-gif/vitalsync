<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Stress Report — VitalSync</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .stat-row{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;}
    .stat-box{flex:1;min-width:120px;background:rgba(240,96,96,0.08);border:1px solid rgba(240,96,96,0.25);border-radius:var(--radius-md);padding:1rem 1.2rem;}
    .stat-val{font-family:'Outfit',sans-serif;font-size:1.6rem;font-weight:800;color:#F8A8A8;}
    .stat-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(200,170,130,0.75);margin-top:4px;}
    .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
    @media(max-width:700px){.charts-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<nav id="nav">
  <a href="/dashboard.html" class="nav-brand"><img src="/assets/logo.png" class="nav-logo" alt="VS"><span class="nav-title brand">VitalSync</span></a>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a><a href="/reports/weight.html">Weight</a>
    <a href="/reports/sleep.html">Sleep</a><a href="/reports/exercise.html">Exercise</a>
    <a href="/reports/meals.html">Meals</a><a href="/reports/goals.html">Goals</a>
  </div>
  <div class="nav-user"><span id="nav-username"></span><button class="btn-nav-logout" id="btn-logout">Logout</button></div>
</nav>
<div id="toast-container"></div>
<div class="page-wrap">
  <div style="margin-bottom:1.8rem">
    <h1 class="page-title">🧠 Stress Report</h1>
    <p class="page-subtitle">Stress trends, high-stress days, spikes, and patterns by hour and weekday.</p>
  </div>

  <div class="stat-row" id="stat-row"></div>

  <div class="glass-card" style="padding:2rem;margin-bottom:1rem">
    <div class="section-label">Stress Trend (Last 30 Readings)</div>
    <canvas id="chart-trend" height="80"></canvas>
  </div>

  <div class="charts-grid">
    <div class="glass-card" style="padding:2rem">
      <div class="section-label">Avg Stress by Hour</div>
      <canvas id="chart-hour" height="140"></canvas>
    </div>
    <div class="glass-card" style="padding:2rem">
      <div class="section-label">Avg Stress by Weekday</div>
      <canvas id="chart-day" height="140"></canvas>
    </div>
  </div>

  <div class="glass-card" style="padding:2rem;margin-bottom:1rem;margin-top:1rem">
    <div class="section-label">High-Stress Readings (&gt; 70)</div>
    <div id="high-table"></div>
  </div>

  <div class="glass-card" style="padding:2rem">
    <div class="section-label">Stress Spikes (Jump ≥ 30 within 2 hours)</div>
    <div id="spike-table"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script type="module">
import { guardAuth, initNav, apiFetch, toast } from '/js/api.js';
await guardAuth(); initNav('/reports/stress.html');
const CO = { ticks:{color:'#9A8A78'}, grid:{color:'rgba(255,200,150,0.05)'} };

try {
  const d = await apiFetch('/api/reports/stress');
  const { readings, stats, highReadings, spikes, byHour, byWeekday } = d;

  document.getElementById('stat-row').innerHTML = [
    ['Average', stats.avg+' / 100'],
    ['Peak',    stats.peak+' / 100'],
    ['High readings (>70)', stats.highCount+''],
    ['Total readings', readings.length+''],
  ].map(([l,v])=>`<div class="stat-box"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('');

  const last30 = readings.slice(-30);
  new Chart(document.getElementById('chart-trend').getContext('2d'),{
    type:'line',
    data:{ labels:last30.map(r=>r.recordedAt?.split('T')[0]||''),
           datasets:[{ label:'Stress Level', data:last30.map(r=>r.level),
             borderColor:'#D4803A', backgroundColor:'rgba(212,128,58,0.1)',
             fill:true, tension:0.35,
             pointBackgroundColor: last30.map(r=>r.level>70?'#F8A8A8':r.level>50?'#F8D880':'#8DEBB8'),
             pointRadius:4 }] },
    options:{ responsive:true, plugins:{legend:{labels:{color:'#EDE0D0'}}},
      scales:{x:{...CO,ticks:{...CO.ticks,maxTicksLimit:8}}, y:{...CO,min:0,max:100}} }
  });

  new Chart(document.getElementById('chart-hour').getContext('2d'),{
    type:'bar',
    data:{ labels:byHour.map(h=>h.hour), datasets:[{label:'Avg Stress',data:byHour.map(h=>h.avg),backgroundColor:'rgba(212,128,58,0.6)',borderRadius:3}] },
    options:{responsive:true,plugins:{legend:{display:false}},scales:{x:CO,y:{...CO,min:0,max:100}}}
  });

  new Chart(document.getElementById('chart-day').getContext('2d'),{
    type:'bar',
    data:{ labels:byWeekday.map(d=>d.day.slice(0,3)), datasets:[{label:'Avg Stress',data:byWeekday.map(d=>d.avg),backgroundColor:'rgba(240,96,96,0.6)',borderRadius:3}] },
    options:{responsive:true,plugins:{legend:{display:false}},scales:{x:CO,y:{...CO,min:0,max:100}}}
  });

  document.getElementById('high-table').innerHTML = highReadings.length ? `
    <table><thead><tr><th>Date & Time</th><th>Level</th><th>Status</th></tr></thead>
    <tbody>${highReadings.map(r=>`<tr>
      <td>${r.recordedAt?.replace('T',' ').slice(0,16)||'—'}</td>
      <td style="color:#F8A8A8;font-weight:700">${r.level}</td>
      <td>${r.status}</td>
    </tr>`).join('')}</tbody></table>` : '<p style="color:rgba(200,170,130,0.70)">No high-stress readings found.</p>';

  document.getElementById('spike-table').innerHTML = spikes.length ? `
    <table><thead><tr><th>Current Time</th><th>Previous Time</th><th>Previous Level</th><th>Current Level</th><th>Jump</th></tr></thead>
    <tbody>${spikes.map(s=>`<tr>
      <td>${s.currentTime?.replace('T',' ').slice(0,16)}</td>
      <td>${s.previousTime?.replace('T',' ').slice(0,16)}</td>
      <td>${s.previousLevel}</td><td>${s.currentLevel}</td>
      <td style="color:#F8A8A8;font-weight:700">+${s.jump}</td>
    </tr>`).join('')}</tbody></table>` : '<p style="color:rgba(200,170,130,0.70)">No significant stress spikes found.</p>';

} catch(err){ toast(err.message,'error'); }
</script>
</body></html>
