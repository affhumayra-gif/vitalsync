<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — VitalSync</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="toast-container"></div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="/assets/logo.png" alt="VitalSync" class="auth-logo">
      <span class="auth-brand-name brand">VitalSync</span>
    </div>

    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Start your health tracking journey</p>

    <!-- Google -->
    <button class="btn-google" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" style="flex-shrink:0"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign up with Google
    </button>

    <div class="auth-divider"><span>or create with email</span></div>

    <form id="register-form" style="width:100%">
      <div class="form-group">
        <div class="input-wrap">
          <i class="fa fa-user input-icon"></i>
          <input type="text" name="username" placeholder="Full name" required minlength="2" autocomplete="name">
        </div>
      </div>
      <div class="form-group">
        <div class="input-wrap">
          <i class="fa fa-envelope input-icon"></i>
          <input type="email" name="email" placeholder="Email address" required autocomplete="email">
        </div>
      </div>
      <div class="form-group">
        <div class="input-wrap">
          <i class="fa fa-lock input-icon"></i>
          <input type="password" name="password" placeholder="Password (min 6 characters)" required minlength="6" autocomplete="new-password">
        </div>
      </div>
      <button type="submit" class="btn-primary" style="margin-top:0.8rem">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/index.html">Sign in</a>
    </div>
  </div>
</div>

<script type="module" src="/js/auth.js"></script>
</body>
</html>
