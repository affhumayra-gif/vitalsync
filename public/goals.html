<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals — VitalSync</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ── Preset chips ── */
    .goal-chip{display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(12,7,3,0.5);border:1px solid var(--border);border-radius:999px;font-size:0.85rem;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:all 0.18s;}
    .goal-chip:hover,.goal-chip.selected{background:var(--copper-glow-md);border-color:var(--copper);color:var(--copper-pale);}
    .goal-chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.2rem;}

    /* ── Completion card ── */
    .completion-card{padding:1rem 1.2rem;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-md);transition:all 0.2s;margin-bottom:8px;}
    .completion-card.done{background:rgba(82,201,148,0.07);border-color:rgba(82,201,148,0.30);}

    /* ── Checkbox ── */
    .goal-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border-hover);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.18s;}
    .goal-check.checked{background:var(--success);border-color:var(--success);}
    .goal-check i{font-size:0.75rem;color:#fff;display:none;}
    .goal-check.checked i{display:block;}
    /* Auto-tracked checkboxes are not clickable — show a different cursor */
    .goal-check.auto-check{cursor:default;opacity:0.85;}

    /* ── Goal text ── */
    .goal-title{font-size:0.9rem;font-weight:600;color:var(--text);margin:0;}
    .goal-title.done-text{color:#8DEBB8;text-decoration:line-through;opacity:0.7;}

    /* ── Per-goal progress bar ── */
    .goal-progress-wrap{height:5px;background:rgba(255,200,150,0.1);border-radius:999px;overflow:hidden;margin:6px 0 4px;border:1px solid rgba(255,200,150,0.08);}
    .goal-progress-bar{height:100%;border-radius:999px;transition:width 0.4s ease,background 0.3s;min-width:2px;}
    .goal-progress-text{font-size:0.78rem;color:rgba(200,168,128,0.85);font-weight:500;}

    /* ── Status badges ── */
    .auto-badge{font-size:0.72rem;padding:2px 9px;background:rgba(82,201,148,0.14);border:1px solid rgba(82,201,148,0.35);border-radius:999px;color:#8DEBB8;font-weight:700;white-space:nowrap;}
    .manual-done-badge{font-size:0.72rem;padding:2px 9px;background:var(--copper-glow);border:1px solid var(--border-hover);border-radius:999px;color:var(--copper-light);font-weight:700;white-space:nowrap;}
    .tap-badge{font-size:0.72rem;color:var(--text-muted);font-weight:500;}

    /* ── Overall progress bar ── */
    .completion-bar-wrap{background:rgba(82,201,148,0.1);border-radius:999px;height:8px;overflow:hidden;margin:0.8rem 0 0.4rem;border:1px solid rgba(82,201,148,0.2);}
    .completion-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#52C990,#8DEBB8);transition:width 0.4s ease;}

    /* ── Active goal rows ── */
    .active-goal-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(255,200,150,0.06);}
    .active-goal-row:last-child{border-bottom:none;}
    .btn-icon{width:30px;height:30px;border-radius:var(--radius-xs);border:1px solid var(--border);background:rgba(12,7,3,0.5);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.75rem;transition:all 0.18s;}
    .btn-icon.danger:hover{border-color:var(--danger-border);color:#F8A8A8;background:var(--danger-bg);}
    .empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text-muted);font-size:0.9rem;display:flex;flex-direction:column;align-items:center;}
  </style>
</head>
<body>
<nav id="nav">
  <a href="/dashboard.html" class="nav-brand"><img src="/assets/logo.png" class="nav-logo" alt="VS"><span class="nav-title brand">VitalSync</span></a>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a><a href="/goals.html" class="active">Goals</a><a href="/meals.html">Meals</a>
    <a href="/sleep.html">Sleep</a><a href="/stress.html">Stress</a><a href="/exercise.html">Exercise</a>
    <a href="/weekly.html">Weekly</a><a href="/leaderboard.html">Leaderboard</a><a href="/profile.html">Profile</a>
    <a href="/ai.html">AI Coach</a>
  </div>
  <div class="nav-user"><span id="nav-username"></span><button class="btn-nav-logout" id="btn-logout">Logout</button></div>
</nav>
<div id="toast-container"></div>
<div class="page-wrap">
  <div style="margin-bottom:1.8rem">
    <h1 class="page-title">Goals</h1>
    <p class="page-subtitle">Trackable goals (steps, sleep, exercise, calories) complete automatically from your logged data. Others you check off manually.</p>
  </div>

  <!-- Today's completion -->
  <div class="glass-card copper-top" style="padding:2rem;margin-bottom:1rem">
    <div class="section-label">Today's Goals</div>
    <div class="completion-bar-wrap"><div class="completion-bar" id="comp-bar" style="width:0%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:1rem">
      <span id="comp-label" style="color:var(--text-secondary)">Loading…</span>
      <span id="comp-pct" style="color:var(--copper-light);font-weight:700">0%</span>
    </div>
    <div id="today-goals"></div>
  </div>

  <!-- Add goal -->
  <div class="glass-card" style="padding:2rem;margin-bottom:1rem">
    <div class="section-label">Add a Goal</div>
    <div class="goal-chip-grid" id="preset-chips"></div>
    <div class="form-row" style="margin-bottom:1rem">
      <div><label>Goal Type</label><input type="text" id="goal-type" placeholder="e.g. steps, sleep, water"></div>
      <div><label>Daily Target</label><input type="number" id="goal-target" placeholder="e.g. 10000" min="0"></div>
      <div><label>Unit</label><input type="text" id="goal-unit" placeholder="e.g. steps, hrs, ml"></div>
    </div>
    <button class="btn-primary auto" id="btn-add-goal" style="padding:12px 28px;margin-top:0">
      <i class="fa fa-plus"></i> Add Goal
    </button>
  </div>

  <!-- Active goals -->
  <div class="glass-card" style="padding:2rem">
    <div class="section-label">Active Goals</div>
    <div id="active-goals"></div>
  </div>
</div>
<script type="module" src="/js/goals.js"></script>
</body>
</html>
