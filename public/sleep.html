<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep — VitalSync</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .dur-preview{display:flex;align-items:center;justify-content:center;padding:11px 16px;background:rgba(82,201,148,0.08);border:1px solid rgba(82,201,148,0.25);border-radius:var(--radius-sm);font-size:0.95rem;font-weight:700;color:var(--text-muted);white-space:nowrap;min-width:110px;transition:all 0.2s;}
    .dur-preview.has-value{color:#8DEBB8;border-color:rgba(82,201,148,0.55);background:rgba(82,201,148,0.14);}

    .quality-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:0.75rem;font-weight:700;}
    .q-success{background:rgba(82,201,148,0.15);border:1px solid rgba(82,201,148,0.4);color:#8DEBB8;}
    .q-warning{background:rgba(240,176,64,0.15);border:1px solid rgba(240,176,64,0.4);color:#F8D880;}
    .q-danger {background:rgba(240,96,96,0.15);border:1px solid rgba(240,96,96,0.4);color:#F8A8A8;}
    .q-info   {background:rgba(90,158,224,0.15);border:1px solid rgba(90,158,224,0.4);color:#A8D8FF;}

    .btn-icon{width:30px;height:30px;border-radius:var(--radius-xs);border:1px solid var(--border);background:rgba(12,7,3,0.5);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.75rem;transition:all 0.18s;}
    .btn-icon:hover{border-color:var(--copper);color:var(--copper-light);}
    .btn-icon.danger:hover{border-color:var(--danger-border);color:#F8A8A8;background:var(--danger-bg);}
    .empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text-muted);font-size:0.9rem;display:flex;flex-direction:column;align-items:center;}
    #cancel-sleep{display:none;width:auto;padding:12px 20px;margin-top:0;background:rgba(240,96,96,0.12);border:1px solid var(--danger-border);color:#F8A8A8;}

    /* ── Sleep stat cards ── */
    .sleep-stats{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;}
    .sleep-stat{
      flex:1; min-width:120px;
      background:rgba(82,201,148,0.08);
      border:1px solid rgba(82,201,148,0.22);
      border-radius:var(--radius-md);
      padding:1rem 1.2rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .sleep-stat-val{
      font-family:'Outfit',sans-serif;
      font-size:1.5rem;
      font-weight:800;
      color:#8DEBB8;
      line-height:1;
      margin-bottom:6px;
    }
    /* FIX: was var(--text-muted) = #5A4A38 — invisible over photo background */
    .sleep-stat-label{
      font-size:0.72rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:0.08em;
      color:rgba(230, 210, 180, 0.80);  /* warm light, always readable */
    }
  </style>
</head>
<body>
<nav id="nav">
  <a href="/dashboard.html" class="nav-brand"><img src="/assets/logo.png" class="nav-logo" alt="VS"><span class="nav-title brand">VitalSync</span></a>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a><a href="/goals.html">Goals</a><a href="/meals.html">Meals</a>
    <a href="/sleep.html" class="active">Sleep</a><a href="/stress.html">Stress</a><a href="/exercise.html">Exercise</a>
    <a href="/weekly.html">Weekly</a><a href="/leaderboard.html">Leaderboard</a><a href="/profile.html">Profile</a>
    <a href="/ai.html">AI Coach</a>
  </div>
  <div class="nav-user"><span id="nav-username"></span><button class="btn-nav-logout" id="btn-logout">Logout</button></div>
</nav>
<div id="toast-container"></div>
<div class="page-wrap">
  <div style="margin-bottom:1.8rem">
    <h1 class="page-title">Sleep Tracker</h1>
    <p class="page-subtitle">Log sleep sessions — duration and quality are calculated automatically.</p>
  </div>

  <!-- Stats row -->
  <div class="sleep-stats" id="sleep-stats"></div>

  <!-- Log form -->
  <div class="glass-card copper-top" style="padding:2rem;margin-bottom:1rem" id="sleep-form-card">
    <div class="section-label" id="sleep-form-title">Log Sleep Session</div>
    <div class="form-row" style="margin-bottom:0.8rem">
      <div><label>Bedtime (start)</label><input type="datetime-local" id="sleep-start"></div>
      <div><label>Wake up (end)</label><input type="datetime-local" id="sleep-end"></div>
      <div><label>Times woken up</label><input type="number" id="wake-count" placeholder="0" min="0" max="20" value="0"></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:1rem">
      <div class="dur-preview" id="dur-preview">🌙 — hrs</div>
      <span style="font-size:0.88rem;font-weight:600" id="quality-preview"></span>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-primary auto" id="btn-log-sleep" style="padding:12px 28px;margin-top:0">
        <i class="fa fa-moon"></i> Log Sleep
      </button>
      <button class="btn-primary" id="cancel-sleep"><i class="fa fa-xmark"></i> Cancel</button>
    </div>
  </div>

  <!-- History -->
  <div class="glass-card" style="padding:2rem">
    <div class="section-label">Sleep History</div>
    <div id="sleep-list">
      <div class="empty-state">
        <i class="fa fa-bed" style="font-size:2rem;color:var(--text-muted);margin-bottom:0.8rem"></i>
        <p>No sleep sessions logged yet.</p>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/js/sleep.js"></script>
</body>
</html>
